name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS (NFS, mounted)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # The mount test runs only on machines that can be thrown away: it
      # drives the kernel's NFS client, which once panicked a Mac running it.
      - name: Test
        env:
          PIFS_MOUNT_TEST: "1"
        run: go test -count=1 -v ./...

  windows:
    name: Windows (WinFsp, built)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build and vet
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go build -o /dev/null ./cmd/pharo-image-fs

  # The one check main's ruleset requires: it fails unless every job above
  # passed, so the rule names no job, nor any runner of a matrix.
  gate:
    name: All jobs passed
    needs: [macos, windows]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check every job
        run: test "${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" = true
