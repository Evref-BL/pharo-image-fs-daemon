name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # Static, so a user installs nothing for the daemon; one runner builds
      # every asset, and Go's linker signs darwin/arm64 ad hoc, as macOS
      # requires.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            asset="pharo-image-fs-daemon-${target%/*}-${target#*/}"
            mkdir -p "build/$asset"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -ldflags="-s -w" -o "build/$asset/pharo-image-fs" ./cmd/pharo-image-fs
            (cd "build/$asset" && sha256sum pharo-image-fs > pharo-image-fs.sha256 && zip "../$asset.zip" pharo-image-fs pharo-image-fs.sha256)
          done

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: build/*.zip
